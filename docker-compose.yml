services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: phssumsel/frankenphp:latest
    container_name: inventaris_app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-inventaris}
      DB_USERNAME: ${DB_USERNAME:-inventaris_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventaris_network

  db:
    image: mariadb:10.11
    container_name: inventaris_db
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inventaris}
      MYSQL_USER: ${DB_USERNAME:-inventaris_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - inventaris_network

networks:
  inventaris_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
