services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventaris_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-inventaris}
      DB_USERNAME: ${DB_USERNAME:-inventaris_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - db
    networks:
      - inventaris_network

  node:
    image: node:22-alpine
    profiles:
      - tools
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
      - npm_cache:/root/.npm
    command: sh -c "npm ci && npm run build"
    networks:
      - inventaris_network

  web:
    image: nginx:alpine
    container_name: inventaris_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - inventaris_network

  db:
    image: mariadb:10.11
    container_name: inventaris_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inventaris}
      MYSQL_USER: ${DB_USERNAME:-inventaris_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - inventaris_network

networks:
  inventaris_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  node_modules:
    driver: local
  npm_cache:
    driver: local
