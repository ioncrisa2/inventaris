server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 64M;
    error_page 413 = @upload_too_large;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /protected-files/ {
        internal;
        alias /var/www/html/storage/app/private/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store" always;
    }

    location ^~ /storage/tenants/ {
        alias /var/www/html/storage/app/public/tenants/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location @upload_too_large {
        default_type text/plain;
        return 413 "Ukuran unggahan melebihi batas server. Maksimal 20 MB per file dan 64 MB per permintaan.\n";
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }
}
